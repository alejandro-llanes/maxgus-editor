name: Features

# The editor ships in two sizes, and a `#[cfg]` that only ever gets built one
# way rots quietly. This builds both on every push, which is what stops the
# minimal build from failing the first time someone asks for it.
on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A build that only compiles by accident of a warning is not one anyone
  # should ship.
  RUSTFLAGS: "-D warnings"

jobs:
  builds:
    name: ${{ matrix.features }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - minimal
          - full
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      # The full build has a window in it, and a window needs system
      # libraries a terminal does not. Harmless for the minimal build,
      # which simply does not use them.
      - name: Install what a window needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - name: Build
        run: cargo build --workspace --no-default-features --features ${{ matrix.features }}
      - name: Test
        run: cargo test --workspace --no-default-features --features ${{ matrix.features }}

  lint:
    name: clippy and fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Install what a window needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - run: cargo clippy --workspace --all-targets
      - name: Install what a window needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - run: cargo clippy --workspace --all-targets --no-default-features
