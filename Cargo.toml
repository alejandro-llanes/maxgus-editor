[workspace]
resolver = "3"
members = [
    "crates/maxgus-text",
    "crates/maxgus-config",
    "crates/maxgus-faces",
    "crates/maxgus-keys",
    "crates/maxgus-syntax",
    "crates/maxgus-lsp",
    "crates/maxgus-tree",
    "crates/maxgus-core",
    "crates/maxgus-git",
    "crates/maxgus-term",
    "crates/maxgus-tui",
    "crates/maxgus-gui",
    "crates/maxgus",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/alejandro-llanes/maxgus-editor"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
