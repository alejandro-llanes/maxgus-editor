<?xml version="1.0" encoding="UTF-8"?>
<!--
  The application icon. The editor's own colours: the default background it
  starts in, and the aqua its cursor and accents are drawn in.

  Scalable rather than a set of sizes, because a letterform and a rectangle
  are exactly what does not need hinting at 16 pixels.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="26" fill="#1d1f21"/>
  <rect x="10" y="10" width="108" height="108" rx="18" fill="none"
        stroke="#373b41" stroke-width="2"/>
  <text x="34" y="90" font-family="ui-monospace, 'DejaVu Sans Mono', monospace"
        font-size="72" font-weight="700" fill="#8abeb7">m</text>
  <rect x="82" y="36" width="18" height="52" fill="#8abeb7"/>
</svg>
