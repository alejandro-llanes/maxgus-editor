[package]
name = "maxgus-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
maxgus-config = { version = "0.1.0", path = "../maxgus-config" }
maxgus-faces = { version = "0.1.0", path = "../maxgus-faces" }
maxgus-keys = { version = "0.1.0", path = "../maxgus-keys" }
maxgus-lsp = { version = "0.1.0", path = "../maxgus-lsp", optional = true }
maxgus-syntax = { version = "0.1.0", path = "../maxgus-syntax", optional = true }
maxgus-git = { version = "0.1.0", path = "../maxgus-git", optional = true }
maxgus-grep = { version = "0.1.0", path = "../maxgus-grep", optional = true }
maxgus-script = { version = "0.1.0", path = "../maxgus-script", optional = true }
maxgus-term = { version = "0.1.0", path = "../maxgus-term", optional = true }
maxgus-text = { version = "0.1.0", path = "../maxgus-text" }
maxgus-tree = { version = "0.1.0", path = "../maxgus-tree" }
maxgus-tui = { version = "0.1.0", path = "../maxgus-tui" }
kdl = "6.7.1"
ropey = "1.6.1"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"

[features]
default = ["full"]

# The editor and the treefile, and nothing that needs a grammar, a protocol
# or a subprocess.
minimal = []

# Everything the editor can do.
full = [
    "dep:maxgus-syntax",
    "dep:maxgus-lsp",
    "dep:maxgus-git",
    "dep:maxgus-grep",
    "dep:maxgus-term",
    "dep:maxgus-script",
]
