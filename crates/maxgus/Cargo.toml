[package]
name = "maxgus"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "maxgus"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
ec4rs = "1.2.0"
futures-util = "0.3.34"
maxgus-config = { version = "0.1.0", path = "../maxgus-config" }
maxgus-core = { version = "0.1.0", path = "../maxgus-core", default-features = false }
maxgus-faces = { version = "0.1.0", path = "../maxgus-faces" }
maxgus-keys = { version = "0.1.0", path = "../maxgus-keys" }
maxgus-lsp = { version = "0.1.0", path = "../maxgus-lsp", optional = true }
maxgus-syntax = { version = "0.1.0", path = "../maxgus-syntax", optional = true }
maxgus-text = { version = "0.1.0", path = "../maxgus-text" }
maxgus-tree = { version = "0.1.0", path = "../maxgus-tree" }
maxgus-git = { version = "0.1.0", path = "../maxgus-git", optional = true }
maxgus-grep = { version = "0.1.0", path = "../maxgus-grep", optional = true }
maxgus-term = { version = "0.1.0", path = "../maxgus-term", optional = true }
maxgus-tui = { version = "0.1.0", path = "../maxgus-tui" }
maxgus-gui = { version = "0.1.0", path = "../maxgus-gui", default-features = false, optional = true }
portable-pty = { version = "0.9.0", optional = true }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
rustix = { version = "1.1.4", features = ["pty", "termios", "process", "stdio"] }

[[example]]
name = "screenshot"
required-features = ["full"]

[features]
default = ["full"]

# The editor and the treefile: no tree-sitter grammars, no language server,
# no magit, no terminal, no project search, no scripting. Builds in a
# fraction of the time and makes a much smaller binary.
minimal = ["maxgus-core/minimal"]

# Everything.
full = [
    "maxgus-core/full",
    "dep:maxgus-syntax",
    "dep:maxgus-lsp",
    "dep:maxgus-git",
    "dep:maxgus-grep",
    "dep:maxgus-term",
    "dep:portable-pty",
]

# Everything, and a window drawn by the GPU as well as a terminal.
gui = ["full", "dep:maxgus-gui", "maxgus-gui/full"]
